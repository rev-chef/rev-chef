<svg
  viewBox="0 0 700 950"
  fill="none"
  width="700"
  height="950"
  xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%" class="FG">
    <div xmlns="http://www.w3.org/1999/xhtml" class="html-base">
      <style>
        .FG {
          font-family: Arial, Helvetica, sans-serif;
          background-color: #0d1117;
        }

        .bold {
          font-weight: bold;
        }
        .h1 {
          text-decoration: underline;
          text-align: center;
        }
        .skill-list {
          font-size: 16px;
        }

        .matrix-bg {
          position: relative;
          background: transparent;
          color: #00ff66;
          font-family: "Courier New", monospace;
          text-shadow:
            0 0 5px #00ff66,
            0 0 10px rgba(0, 255, 102, 0.6);
        }
        .matrix-bg h1,
        .matrix-bg p,
        .matrix-bg h2,
        .matrix-bg ul,
        .matrix-bg li {
          color: #c9d1d9;
          font-family: Arial, Helvetica, sans-serif;
          text-shadow: none;
        }
        /* General styling for matrix background */
        .matrix-bg::before,
        .matrix-bg::after {
          content: "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 "
            "01001000 01101001 00100000 01001101 01101111 01101101 00100001 ";
          position: absolute;
          top: -200%;
          left: 0px;
          width: 100%;
          height: 400%;
          writing-mode: vertical-rl;
          text-orientation: upright;
          word-break: break-all;

          letter-spacing: 8px;
        }
        /* Back layer */
        .matrix-bg::before {
          font-size: 14px;
          opacity: 0.45;
          line-height: 8.7;
          animation: matrix-fall 18s linear infinite;
        }

        /* Front Layer */
        .matrix-bg::after {
          font-size: 18px;
          opacity: 0.8;
          line-height: 8;
          animation: matrix-fall 30s linear infinite;
        }

        @keyframes matrix-fall {
          from {
            transform: translateY(0);
          }
          to {
            transform: translateY(50%);
          }
        }
      </style>
      <div class="matrix-bg">
        <h1 class="h1">Hey, I'm Noah</h1>
        <p>
          I'm a Software Development student at the Southern Alberta Institute
          of Technology (SAIT), currently in my 1st year.
          <span class="bold"
            >Currently looking for summer student Co-ops or Internships.</span
          >
        </p>
        <hr />

        <h2 class="h2">✨Skills✨</h2>

        <ul class="skill-list">
          <li class="bold">Front-end Development</li>
          <ul class="inner-list front-end">
            <li>HTML</li>
            <li id="CSS">CSS</li>
            <li>Javascript</li>
          </ul>
          <li class="bold">Back-end Development</li>
          <ul class="inner-list back-end">
            <li>Python</li>
            <li>Java</li>
            <li>Assembly</li>
            <li>SQL</li>
          </ul>
          <li class="bold">Tools</li>
          <ul class="inner-list tools">
            <li>VScode</li>
            <li>Eclipse IDE</li>
            <li>VMware &amp; VirtualBox</li>
            <li>Ghidra &amp; IDA Pro</li>
            <li>Linux</li>
          </ul>
        </ul>
        <hr />
        <h2 class="h2">Pinned Project📌</h2>
        <p>
          <h3>PEel🍌</h3>
          My solo-developed passion project: a PE parser that helped me learn a
          lot more about programming and app development, as well as Windows
          reverse-engineering and PE file internals!
        </p>
        <hr />
        <h2 class="h2">Current Interests🔎</h2>
        <ul>
          <li>
            Improving my app (PEel), and learning as much as I can about
            reverse-engineering.
          </li>
          <li>
            Hardware programming! (raspberry pi, creating custom hardware)
          </li>
          <li>Malware analysis</li>
          <li>Participating in as many CTFs as possible</li>
        </ul>
        <hr />
        <h2 class="h2">Write-ups📝</h2>
        <span class="write-up">Nothing yet, stay tuned!</span>
      </div>
    </div>
  </foreignObject>
</svg>
